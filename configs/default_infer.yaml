# Default configurations which control inference
defaults:
  - dataset: semeval   # Specifies the dataset to be used
  - inference: infer   # Specifies the inference configuration
  - _self_             # Ensures defaults are resolved in this file context

# Hydra configurations
hydra:
  run:
    dir: hydra_output/${now:%Y-%m-%d}/${now:%H-%M-%S}  # Output directory with timestamp formatting
  job:
    chdir: false  # Prevent changing the working directory
