trainer_cfg:
  _target_: trl.SFTTrainer
  _partial_: true
training_args_cfg:
  _target_: trl.SFTConfig # transformers.TrainingArguments
  # For a full list see https://huggingface.co/docs/trl/v0.9.6/en/sft_trainer#trl.SFTConfig
  # and https://huggingface.co/docs/transformers/main_classes/trainer#transformers.TrainingArguments
  num_train_epochs: 3
  eval_strategy: steps
  #If eval_steps smaller than 1, will be interpreted as ratio of total training steps.
  eval_steps: 0.111 #= 1/9, i.e. evaluate 9 times over all epochs
  eval_on_start: true # also evaluate at the start of training so will evaluate 10=1+9 times in total
  save_strategy: steps
  #If save_steps smaller than 1, will be interpreted as ratio of total training steps.
  save_steps: 0.111 #= 1/9, i.e. save 9 times over all epochs
  log_level: info
  logging_steps: 1
  max_grad_norm: 1.0
  per_device_train_batch_size: 16
  per_device_eval_batch_size: 16
  output_dir: ~/FundSciImpact/${training.training_args_cfg.run_name}
  report_to: wandb
  run_name: ???
  push_to_hub: true
  hub_model_id: FundSciImpact/${training.training_args_cfg.run_name}
  hub_private_repo: true
  hub_strategy: checkpoint # the latest checkpoint is also pushed in a subfolder named last-checkpoint
  lr_scheduler_type: linear
  warmup_ratio: 0.1
#  lr_scheduler_kwargs:
#    min_lr_rate: 0.1
  packing: false
  max_seq_length: 1024
resume_from_checkpoint: null